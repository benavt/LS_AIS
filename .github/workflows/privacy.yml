name: Privacy
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Scan tracked files
        run: python scripts/check_privacy.py
      - name: Scan site/ as a published directory
        if: always()
        run: python scripts/check_privacy.py --dir site
      - name: Checker unit tests
        if: always()
        run: python -m unittest tests.test_check_privacy -v
  published-site:
    # GitHub Pages serves the gh-pages branch; scan exactly what it publishes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          path: checker
          sparse-checkout: scripts/check_privacy.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          ref: gh-pages
          path: published
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Scan the gh-pages tree
        run: |
          rm -rf published/.git
          python checker/scripts/check_privacy.py --dir published
